<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHH Project Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        .card { background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto text-gray-800 relative">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 text-white px-6 py-3 rounded shadow-lg transition-opacity duration-300 opacity-0 pointer-events-none z-50 font-bold">
        Message
    </div>

    <!-- Header -->
    <div class="flex justify-between items-center mb-6 flex-wrap gap-2">
        <div>
            <h1 class="text-2xl font-bold text-blue-800">BHH Project Tracker</h1>
            <p id="subHeaderTitle" class="text-sm text-gray-500">BHH Engineering Project</p>
        </div>
        <div class="flex items-center gap-3">
            <span id="connectionStatus" class="text-xs bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full font-semibold border border-yellow-300 shadow-sm">
                กำลังเชื่อมต่อ Cloud...
            </span>
            <button id="btnBackToHome" style="display: none;" onclick="backToHome()" class="bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-700 transition">
                ← กลับหน้าหลัก
            </button>
        </div>
    </div>

    <!-- VIEW 1: HOME / PROJECT LIST -->
    <div id="homeView">
        <div class="card flex flex-col md:flex-row justify-between items-center gap-4 bg-gradient-to-r from-blue-50 to-indigo-50 border border-blue-100">
            <div>
                <h2 class="text-lg font-bold text-blue-900">รายการโครงการทั้งหมด</h2>
                <p class="text-sm text-gray-600">เลือกโครงการเพื่อเข้าจัดการแผนงาน ติดตาม S-Curve และอัปเดตหน้างาน</p>
            </div>
            <button onclick="openCreateModal()" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-blue-700 transition shadow flex items-center gap-2">
                <span>+ สร้างโครงการใหม่</span>
            </button>
        </div>

        <div id="projectGrid" class="grid grid-cols-1 md:grid-cols-2
